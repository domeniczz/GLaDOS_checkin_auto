name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 1点30分(北京时间 9点30分)
    - cron: 30 1 * * *
  watch:
    types: [started]

permissions:
  # 允许 GITHUB_TOKEN 在末尾 commit & push points_log.json
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      # 恢复历史积分记录（cache 7天未访问会被清理，故下方 git commit 作为兜底）
      - name: Restore points log cache
        uses: actions/cache@v5
        with:
          # 每次运行用唯一 key 强制 miss 但会保存新缓存；restore-keys 按前缀恢复上一次的
          path: points_log.json
          key: glados-points-log-${{ github.run_id }}
          restore-keys: |
            glados-points-log-
      - name: Run checkin
        run: |
          python3 glados.py
        env:
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          DEFAULT_CURRENT_POINTS: "281"
      # 兜底持久化：把积分记录提交回仓库，避免 cache 被清理后数据丢失
      - name: Commit points log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add points_log.json
          git diff --cached --quiet || git commit -m "chore: update points log [skip ci]"
          git push
